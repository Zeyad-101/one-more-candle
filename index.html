<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>One More Candle</title>
  <meta name="description" content="Send a personalized birthday surprise to a friend." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Page-specific tweaks — just enough to lay out the front door. The
       scene/gradient/colors/fonts all come from css/style.css tokens. */
    .landing {
      gap: 28px;
      text-align: center;
    }
    .landing-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.6rem, 8vw, 4.5rem);
      line-height: 1.05;
      margin: 0;
      color: var(--omc-cream-white);
      letter-spacing: -0.01em;
    }
    .landing-emoji {
      display: inline-block;
      vertical-align: middle;
      margin-right: 0.2em;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.25));
    }
    .landing-tagline {
      margin: 0;
      color: rgba(255, 248, 240, 0.78);
      font-size: 1.15rem;
      max-width: 380px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="scene theme-sunset landing">
    <h1 class="landing-title">
      <span class="landing-emoji" aria-hidden="true">🎂</span>One More Candle
    </h1>
    <p class="landing-tagline">Send a personalized birthday surprise to a friend.</p>
    <a class="omc-btn" href="creator.html">Create a gift</a>
  </main>
</body>
</html>
